_base: ../base.yaml
name: duke_two_step_allview
data: {manifest: manifests/duke_master.csv, image_size: 112, views: all}
task: {type: two_step, compose: product, compose_order: per_image_then_encounter_mean}
classifier:
  _base: ../classifier/compactcnn.yaml
generator:
