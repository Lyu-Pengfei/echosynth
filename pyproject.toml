[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echosynth"
version = "0.1.0"
description = "Reproducible synthetic echocardiogram research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "EchoSynth contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
imaging = ["pydicom>=2.4,<4", "opencv-python-headless>=4.9,<5"]
generative = ["accelerate>=0.27,<2", "einops>=0.7,<1", "ema-pytorch>=0.4,<1"]
evaluation = ["matplotlib>=3.8,<4", "umap-learn>=0.5,<1"]
views = ["onnxruntime>=1.17,<2"]
dev = ["mypy>=1.8,<2", "pandas-stubs", "pytest>=8,<9", "ruff>=0.3,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["slow: computationally intensive test", "reproduction: requires mounted research data"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["echosynth"]
warn_unreachable = true
plugins = []
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["accelerate.*", "cv2.*", "ema_pytorch.*", "pandas.*", "pydicom.*", "sklearn.*", "scipy.*", "tensorflow.*", "tf2onnx.*", "umap.*", "onnxruntime.*", "yaml.*"]
ignore_missing_imports = true
